[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codejourney"
version = "0.2.3"
description = "Educational Python execution visualization for Jupyter notebooks"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "CS1302 Group 09"}]

[project.urls]
Homepage = "https://github.com/ercch/cs1302-group09-project"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
